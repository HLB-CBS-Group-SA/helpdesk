# DISABLED IN THE HLB FORK — see .github/workflows/build.yml for the full rationale.
#
# Upstream runs semantic-release on every push to `main`. In this fork `main`
# tracks upstream and our work lives on `hlb-fork/*`, so it is inert today — but
# it would create releases and tags in OUR repository the moment anything landed
# on `main`, and our fork tags (`hlb-v<upstream>-<n>`) are load-bearing pins.
#
# Neutered rather than deleted so the reason survives the next rebase.

name: Generate Semantic Release (disabled in fork)

on:
  workflow_dispatch:

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain
        run: echo "Disabled in the HLB fork — releases and tags here are cut by hand."
