# DISABLED IN THE HLB FORK — see .github/workflows/build.yml for the full rationale.
#
# Upstream's version fires on `release: [released]` and PATCHes release notes on
# `/repos/frappe/helpdesk/releases/...` — i.e. it reaches out and writes to the
# UPSTREAM repository, not this one. It needs a `RELEASE_TOKEN` we do not hold, so
# it would fail rather than succeed, but a workflow in our fork that tries to
# mutate frappe/helpdesk has no business existing.
#
# Neutered rather than deleted so the reason survives the next rebase.

name: Release Notes (disabled in fork)

on:
  workflow_dispatch:

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain
        run: echo "Disabled in the HLB fork — this wrote to frappe/helpdesk, not to us."
