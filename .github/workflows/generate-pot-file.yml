# DISABLED IN THE HLB FORK — see .github/workflows/build.yml for the full rationale.
#
# Upstream runs this weekly on cron with `permissions: contents: write` and
# commits a regenerated POT file to `develop`. We do not maintain translations in
# this fork, and a scheduled job with write access running unattended against a
# branch nobody watches is not something we want inherited.
#
# Neutered rather than deleted so the reason survives the next rebase.

name: Regenerate POT file (disabled in fork)

on:
  workflow_dispatch:

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain
        run: echo "Disabled in the HLB fork — translations are not maintained here."
