# DISABLED IN THE HLB FORK — do not re-enable without reading this.
#
# Upstream's version of this file triggers on `push: tags: ["*"]` and publishes to
# `ghcr.io/${{ github.repository }}`. In this fork that expands to
# `ghcr.io/jn-co-hlb/helpdesk` — the SAME GHCR package the deploy repo
# (jn-co-hlb/HLB-CBS-Helpdesk-Deploy) builds our production image into.
#
# Our fork release process pushes a tag on every fork change
# (`hlb-v<upstream>-<n>`, see DEPENDENCIES.md), so upstream's workflow fired on
# exactly the action we perform most, and published:
#
#     ghcr.io/jn-co-hlb/helpdesk:hlb-v1.28.1-2   <- github.ref_name
#     ghcr.io/jn-co-hlb/helpdesk:stable
#
# built from `FRAPPE_BRANCH=version-15` and UPSTREAM `frappe/helpdesk@main`, with
# neither `company_helpdesk` nor `wiki` in it. It never overwrote `:latest` or
# `:<40-char-sha>`, so the NAS was not pulling it — but it left a decoy image at
# precisely the tag name our own docs call "the pin", so setting
# IMAGE_TAG=hlb-v1.28.1-2 would have run a Frappe v15 site with none of our apps.
#
# Neutered rather than deleted so the reason survives the next rebase onto a new
# upstream tag. The durable fix is repo Settings -> Actions -> General ->
# "Disable actions" on this fork; this file is defence in depth.
#
# Our images are built ONLY by jn-co-hlb/HLB-CBS-Helpdesk-Deploy
# (.github/workflows/build-and-deploy.yml), which pins frappe, the fork tag,
# wiki and company_helpdesk via apps.json.

name: Build Container Image (disabled in fork)

on:
  workflow_dispatch:

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain
        run: |
          echo "Disabled in the HLB fork — see the comment at the top of this file."
          echo "Production images are built by jn-co-hlb/HLB-CBS-Helpdesk-Deploy."
